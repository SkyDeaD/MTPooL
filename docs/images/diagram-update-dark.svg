<text x="480.0" y="74.0" font-size="24" font-weight="600" fill="#eceef3" text-anchor="middle">GitHub Releases</text>
<text x="496" y="141" font-size="18" font-weight="400" fill="#aab1bf" text-anchor="start">опрос раз в 5 минут</text>
<text x="480.0" y="205.0" font-size="24" font-weight="600" fill="#eceef3" text-anchor="middle">Регистратор</text>
<text x="480.0" y="233.0" font-size="17" font-weight="400" fill="#aab1bf" text-anchor="middle">проверяет подпись и кладёт релиз в /var/lib/mtpool/releases</text>
<text x="496" y="293" font-size="18" font-weight="400" fill="#aab1bf" text-anchor="start">manifest.json изменился</text>
<text x="480.0" y="362.0" font-size="24" font-weight="600" fill="#eceef3" text-anchor="middle">mtpool-registrar-update.path</text>
<text x="480.0" y="477.0" font-size="24" font-weight="600" fill="#eceef3" text-anchor="middle">mtpool-registrar-update.service</text>
<text x="480.0" y="505.0" font-size="17" font-weight="400" fill="#aab1bf" text-anchor="middle">от root: подпись, суммы, смена бинарника, перезапуск, 60 с наблюдения за /readyz</text>
<text x="496" y="565" font-size="18" font-weight="400" fill="#aab1bf" text-anchor="start">не поднялся</text>
<text x="480.0" y="634.0" font-size="24" font-weight="600" fill="#eceef3" text-anchor="middle">mtpool-registrar-rollback.service</text>
</svg>
