<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 690" width="960" height="690" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title>Как обновляется регистратор</title>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9 5 L0 9.2 Z" fill="#868e9d"/></marker></defs>
<rect x="0.75" y="0.75" width="958.5" height="688.5" rx="12" fill="#14171e" stroke="#2c313c" stroke-width="1.5"/>
<path d="M480 104 L480 164" fill="none" stroke="#868e9d" stroke-width="2" marker-end="url(#head)"/>
<path d="M480 256 L480 316" fill="none" stroke="#868e9d" stroke-width="2" marker-end="url(#head)"/>
<path d="M480 392 L480 436" fill="none" stroke="#868e9d" stroke-width="2" marker-end="url(#head)"/>
<path d="M480 528 L480 588" fill="none" stroke="#868e9d" stroke-width="2" marker-end="url(#head)"/>
<rect x="40" y="28" width="880" height="76" rx="10" fill="#1a1e27" stroke="#868e9d" stroke-width="2"/>
<rect x="40" y="164" width="880" height="92" rx="10" fill="#1a2940" stroke="#5aa5ff" stroke-width="2"/>
<rect x="40" y="316" width="880" height="76" rx="10" fill="#1a1e27" stroke="#868e9d" stroke-width="2"/>
<rect x="40" y="436" width="880" height="92" rx="10" fill="#1a1e27" stroke="#868e9d" stroke-width="2"/>
