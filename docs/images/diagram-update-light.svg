<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 690" width="960" height="690" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title>Как обновляется регистратор</title>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9 5 L0 9.2 Z" fill="#616a7b"/></marker></defs>
<rect x="0.75" y="0.75" width="958.5" height="688.5" rx="12" fill="#ffffff" stroke="#d5d9e0" stroke-width="1.5"/>
<path d="M480 104 L480 164" fill="none" stroke="#616a7b" stroke-width="2" marker-end="url(#head)"/>
<path d="M480 256 L480 316" fill="none" stroke="#616a7b" stroke-width="2" marker-end="url(#head)"/>
<path d="M480 392 L480 436" fill="none" stroke="#616a7b" stroke-width="2" marker-end="url(#head)"/>
<path d="M480 528 L480 588" fill="none" stroke="#616a7b" stroke-width="2" marker-end="url(#head)"/>
<rect x="40" y="28" width="880" height="76" rx="10" fill="#f6f7f9" stroke="#616a7b" stroke-width="2"/>
<rect x="40" y="164" width="880" height="92" rx="10" fill="#e7f0fd" stroke="#0b63e5" stroke-width="2"/>
<rect x="40" y="316" width="880" height="76" rx="10" fill="#f6f7f9" stroke="#616a7b" stroke-width="2"/>
<rect x="40" y="436" width="880" height="92" rx="10" fill="#f6f7f9" stroke="#616a7b" stroke-width="2"/>
<rect x="40" y="588" width="880" height="76" rx="10" fill="#f8f1e0" stroke="#8a5600" stroke-width="2"/>
<text x="480.0" y="74.0" font-size="24" font-weight="600" fill="#12161f" text-anchor="middle">GitHub Releases</text>
<text x="496" y="141" font-size="18" font-weight="400" fill="#475062" text-anchor="start">опрос раз в 5 минут</text>
<text x="480.0" y="205.0" font-size="24" font-weight="600" fill="#12161f" text-anchor="middle">Регистратор</text>
<text x="480.0" y="233.0" font-size="17" font-weight="400" fill="#475062" text-anchor="middle">проверяет подпись и кладёт релиз в /var/lib/mtpool/releases</text>
<text x="496" y="293" font-size="18" font-weight="400" fill="#475062" text-anchor="start">manifest.json изменился</text>
<text x="480.0" y="362.0" font-size="24" font-weight="600" fill="#12161f" text-anchor="middle">mtpool-registrar-update.path</text>
<text x="480.0" y="477.0" font-size="24" font-weight="600" fill="#12161f" text-anchor="middle">mtpool-registrar-update.service</text>
<text x="480.0" y="505.0" font-size="17" font-weight="400" fill="#475062" text-anchor="middle">от root: подпись, суммы, смена бинарника, перезапуск, 60 с наблюдения за /readyz</text>
<text x="496" y="565" font-size="18" font-weight="400" fill="#475062" text-anchor="start">не поднялся</text>
<text x="480.0" y="634.0" font-size="24" font-weight="600" fill="#12161f" text-anchor="middle">mtpool-registrar-rollback.service</text>
</svg>
