[graph]
targets = ["x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl"]

[advisories]
yanked = "deny"

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "OpenSSL",
  "Unicode-3.0",
  "Zlib",
  "CDLA-Permissive-2.0",
]

# Reached only through the embed macro at build time, and used as is.
[[licenses.exceptions]]
allow = ["MPL-2.0"]
crate = "option-ext"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The crates of this workspace name each other by path; none of them is published.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
