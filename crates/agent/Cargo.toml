[package]
name = "mtpool-agent"
description = "Node agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
mtpool-protocol.workspace = true
mtpool-selfupdate.workspace = true
async-trait.workspace = true
clap = { workspace = true, features = ["derive"] }
rand.workspace = true
reqwest = { workspace = true, features = ["json", "rustls"] }
rustix = { workspace = true, features = ["fs", "std"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time = { workspace = true, features = ["formatting"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt-multi-thread", "fs", "signal", "sync", "time"] }
toml_edit = { workspace = true, features = ["serde"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
minisign.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
wiremock.workspace = true
