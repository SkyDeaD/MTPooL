# The starting configuration of the engine on a stand node; the agent rewrites the port, the
# domain and the users from what the registrar says. The user here is a throwaway.
[general]
use_middle_proxy = false

[general.modes]
classic = false
secure = false
tls = true

[general.telemetry]
core_enabled = true
user_enabled = true

[network]
ipv4 = true
ipv6 = false
prefer = 4

[server]
port = 443
metrics_listen = "127.0.0.1:9090"

[censorship]
tls_domain = "www.example.com"

[access.users]
standby = "00112233445566778899aabbccddeeff"
