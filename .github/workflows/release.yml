name: Release

# Builds static binaries for both targets, signs the manifest with the release key and publishes a
# GitHub release. The registrar and the agent update themselves from this release, so a mistake
# here reaches every node: the checks are strict and every action is pinned by commit.
#
# Run it by hand with the version to release (x.y.z or x.y.z-pre.N). It never runs for pull
# requests. The signing key lives in the environment "release"; restrict that environment to the
# default branch in the repository settings.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, for example 0.1.0 or 0.1.0-rc.1 (no leading v)
        required: true
        type: string
      rotate_key:
        description: Announce deploy/minisign.pub as the new signing key (this release is still signed with the old key)
        required: false
        default: false
        type: boolean

# No job gets more than this unless it says so.
permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the version, the tag and the built-in key
        id: check
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # The version goes through the environment only; it is never pasted into a command.
          num='(0|[1-9][0-9]*)'
          ident='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          semver="^${num}\\.${num}\\.${num}(-${ident}(\\.${ident})*)?\$"
          if ! [[ $VERSION =~ $semver ]]; then
            echo "::error::The version must be semver such as 1.2.3 or 1.2.3-rc.1, without a leading v and without build metadata."
            exit 1
          fi
          tag="v$VERSION"

          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "::error::The tag $tag already exists. A released version is never rebuilt; pick a new version."
            exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::A release for $tag already exists."
            exit 1
          fi

          # Binaries built without the public key cannot verify an update, so refuse to start.
          if [ ! -f deploy/minisign.pub ]; then
            echo "::error::deploy/minisign.pub is missing. A release without the built-in public key could not update itself. Generate the signing key and commit its public half first."
            exit 1
          fi
          key=$(grep -v '^untrusted comment:' deploy/minisign.pub | grep -v '^[[:space:]]*$' | head -n 1 | tr -d '[:space:]')
          if ! [[ $key =~ ^[A-Za-z0-9+/=]{56}$ ]]; then
            echo "::error::deploy/minisign.pub does not hold a minisign public key."
            exit 1
          fi

          {
            echo "version=$VERSION"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

  web:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run check:budget
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 1

  build:
    needs: [prepare, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TARGET: ${{ matrix.target }}
      # The public key is compiled into both binaries; the build script fails without it.
      MTPOOL_MINISIGN_PUB_FILE: deploy/minisign.pub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # web/dist is embedded into the registrar at compile time, so it must exist before the build.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist
      - name: Check the built-in key and the web build
        run: |
          set -euo pipefail
          test -f "$MTPOOL_MINISIGN_PUB_FILE" || { echo "::error::$MTPOOL_MINISIGN_PUB_FILE is missing; the binaries could not verify an update."; exit 1; }
          test -f web/dist/index.html || { echo "::error::web/dist/index.html is missing; the registrar would ship without its UI."; exit 1; }
      - name: Stamp the version
        run: bash scripts/stamp-version.sh "$VERSION"
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-zigbuild@0.24.0
      # No build cache here on purpose: a release is built from the pinned sources only.
      - name: Build
        run: |
          set -euo pipefail
          rustup target add "$TARGET"
          cargo zigbuild --release --locked --target "$TARGET" -p mtpool-registrar -p mtpool-agent
      - name: Check the binaries
        run: |
          set -euo pipefail
          mkdir dist
          for component in mtpool-registrar mtpool-agent; do
            cp "target/$TARGET/release/$component" "dist/$component-$TARGET"
            file "dist/$component-$TARGET"
            file "dist/$component-$TARGET" | grep -q 'statically linked' || { echo "::error::$component-$TARGET is not statically linked."; exit 1; }
          done
          size=$(stat -c %s "dist/mtpool-agent-$TARGET")
          echo "agent size: $size bytes"
          [ "$size" -lt $((15 * 1024 * 1024)) ] || { echo "::error::The agent is 15 MB or more."; exit 1; }
      - name: The agent carries the key of deploy/minisign.pub (x86_64 only, the runner cannot run the other)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          set -euo pipefail
          line=$(grep -v '^untrusted comment:' deploy/minisign.pub | grep -v '^[[:space:]]*$' | head -n 1 | tr -d '[:space:]')
          # The key id is bytes 3 to 10 of the decoded key, little-endian.
          want=$(printf '%s' "$line" | base64 -d | head -c 10 | tail -c 8 | od -An -tx1 | tr -d ' \n' | fold -w2 | tac | tr -d '\n' | tr 'a-f' 'A-F')
          got=$("dist/mtpool-agent-$TARGET" version)
          echo "agent says: $got"
          case "$got" in
            "$VERSION (signing key $want)") ;;
            *) echo "::error::The agent reports '$got', expected '$VERSION (signing key $want)'."; exit 1 ;;
          esac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  sbom:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-cyclonedx@0.5.9
      - name: Stamp the version
        run: bash scripts/stamp-version.sh "$VERSION"
      - name: One bill of materials for both binaries
        run: |
          set -euo pipefail
          rustup target add x86_64-unknown-linux-musl
          cargo cyclonedx --format json --spec-version 1.5 --target x86_64-unknown-linux-musl
          jq -s '
            .[0] as $r | .[1] as $a | $r
            | .components = (($r.components + $a.components + [$a.metadata.component]) | unique_by(."bom-ref"))
            | .dependencies = (($r.dependencies + $a.dependencies) | unique_by(.ref))
          ' crates/registrar/mtpool-registrar.cdx.json crates/agent/mtpool-agent.cdx.json > sbom.cdx.json
          jq -e '.bomFormat == "CycloneDX" and (.components | length) > 0' sbom.cdx.json >/dev/null
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [prepare, build, sbom]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The secrets are in this environment only.
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      ROTATE_KEY: ${{ inputs.rotate_key }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: dist
      - name: Write the manifest
        run: |
          set -euo pipefail
          if [ "$ROTATE_KEY" = "true" ]; then
            cp deploy/minisign.pub dist/minisign.pub
            bash scripts/make-manifest.sh "$VERSION" dist --announce-key minisign.pub
          else
            bash scripts/make-manifest.sh "$VERSION" dist
          fi
          cat dist/manifest.json
      - name: Install minisign
        # The release of the minisign author, pinned by version and checksum.
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          curl -fsSL --retry 3 -o "$work/minisign.tar.gz" https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz
          echo "9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73  $work/minisign.tar.gz" | sha256sum -c -
          tar -xzf "$work/minisign.tar.gz" -C "$work"
          sudo install -m 0755 "$work/minisign-linux/x86_64/minisign" /usr/local/bin/minisign
          rm -rf "$work"
          minisign -v
      - name: Sign the manifest
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/release.key"
          trap 'rm -f "$key_file"' EXIT
          if [ -z "${MINISIGN_SECRET_KEY:-}" ] || [ -z "${MINISIGN_PASSWORD:-}" ]; then
            echo "::error::The secrets MINISIGN_SECRET_KEY and MINISIGN_PASSWORD are not set in the environment release."
            exit 1
          fi
          (
            umask 077
            printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key_file"
          )
          # The password goes in on stdin (printf is a shell builtin), never on a command line.
          printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$key_file" -m dist/manifest.json -x dist/manifest.json.minisig >/dev/null
          rm -f "$key_file"
          test -s dist/manifest.json.minisig
      - name: Verify the signature against the public key
        run: |
          set -euo pipefail
          if [ "$ROTATE_KEY" = "true" ]; then
            # The old key signed this one and is not in the repository any more; the check
            # that matters is that a node holding the old key accepts it, see the runbook.
            echo "key rotation: the signature is checked by the nodes with the old key"
          else
            minisign -Vm dist/manifest.json -x dist/manifest.json.minisig -p deploy/minisign.pub
          fi
      - name: Remove the key file whatever happened
        if: always()
        run: rm -f "$RUNNER_TEMP/release.key"
      - name: Attest the files
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/mtpool-registrar-*
            dist/mtpool-agent-*
            dist/manifest.json
            dist/manifest.json.minisig
            dist/sbom.cdx.json
      - name: Check once more that the tag is free, then publish
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::The tag $TAG appeared while the release was being built."
            exit 1
          fi
          files=(dist/mtpool-registrar-* dist/mtpool-agent-* dist/manifest.json dist/manifest.json.minisig dist/sbom.cdx.json)
          if [ "$ROTATE_KEY" = "true" ]; then
            files+=(dist/minisign.pub)
          fi
          flags=()
          case "$VERSION" in
            *-*) flags+=(--prerelease) ;;
          esac
          gh release create "$TAG" "${files[@]}" "${flags[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes "Signed release $VERSION. Verify a file with: gh attestation verify <file> --repo $GITHUB_REPOSITORY"
