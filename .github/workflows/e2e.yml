name: E2E

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stand:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build the images
        run: docker compose -f e2e/compose.yml build
      - name: Run the smoke scenario
        env:
          # A failed run leaves the stand up, so that its logs can be collected below.
          MTPOOL_E2E_KEEP: "1"
        run: cargo test -p mtpool-e2e --test smoke --locked -- --ignored --nocapture
      - name: Collect the logs of the stand
        if: failure()
        run: |
          mkdir -p e2e-logs
          for project in $(docker compose ls --all --format json | jq -r '.[].Name | select(startswith("mtpool-e2e-"))'); do
            docker compose -p "$project" -f e2e/compose.yml logs --no-color > "e2e-logs/$project.log" 2>&1 || true
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-logs
          path: e2e-logs
          if-no-files-found: ignore
      - name: Take the stand down
        if: always()
        run: |
          for project in $(docker compose ls --all --format json | jq -r '.[].Name | select(startswith("mtpool-e2e-"))'); do
            docker compose -p "$project" -f e2e/compose.yml down -v || true
          done
